<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-068 · Quadrilaterals</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Varignon Parallelogram</text>

  <!-- Core Content Graphic -->
  <g transform="translate(50, 68)">
    <polygon class="layer-stage-1" points="80,20 220,45 190,145 30,125" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon class="layer-stage-2" points="150,32 205,95 110,135 55,72" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <circle class="layer-stage-3 formal-labels" cx="150" cy="32" r="4" fill="#15803d"/>
    <circle class="layer-stage-3 formal-labels" cx="205" cy="95" r="4" fill="#15803d"/>
    <circle class="layer-stage-3 formal-labels" cx="110" cy="135" r="4" fill="#15803d"/>
    <circle class="layer-stage-3 formal-labels" cx="55" cy="72" r="4" fill="#15803d"/>
    <text class="layer-stage-4" x="125" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Midpoint Quadrilateral</text>
    <text class="layer-stage-4" x="125" y="165" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Varignon Theorem: Connecting midpoints always forms parallelogram</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Varignon theorem: Connecting</tspan>
    <tspan x="200" dy="14">midpoints of any quadrilateral forms a parallelogram</tspan>
  </text>
</svg>
