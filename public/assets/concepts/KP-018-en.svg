<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-018 · Fractional Equations</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Extraneous Root Verification</text>

  <!-- Core Content Graphic -->
  <g transform="translate(35, 80)">
    <line class="layer-stage-1" x1="20" y1="70" x2="310" y2="70" stroke="#94a3b8" stroke-width="1.5"/>
    <circle class="layer-stage-1" cx="90" cy="70" r="5" fill="#16a34a"/>
    <text class="layer-stage-1" x="90" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">x = 2 (Valid Root)</text>
    <circle class="layer-stage-2" cx="220" cy="70" r="5" fill="#dc2626"/>
    <path class="layer-stage-3 formal-labels" d="M212,62 L228,78 M228,62 L212,78" stroke="#dc2626" stroke-width="2.5"/>
    <text class="layer-stage-3 formal-labels" x="220" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">x = 3 (Extraneous Root)</text>
    <text class="layer-stage-4" x="220" y="45" text-anchor="middle" font-size="10" font-weight="bold" fill="#b91c1c">Denominator x-3 = 0</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Roots making common</tspan>
    <tspan x="200" dy="14">denominator zero are extraneous and rejected</tspan>
  </text>
</svg>
