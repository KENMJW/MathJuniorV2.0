<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-090 · Trigonometry</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Practical Applications</text>

  <!-- Core Content Graphic -->
  <g transform="translate(45, 68)">
    <line class="layer-stage-1" x1="20" y1="140" x2="260" y2="140" stroke="#475569" stroke-width="2"/>
    <rect class="layer-stage-2" x="210" y="30" width="25" height="110" fill="#94a3b8"/>
    <text class="layer-stage-2" x="245" y="85" font-size="11" font-weight="bold" fill="#dc2626">Height h</text>
    <circle class="layer-stage-3 formal-labels" cx="50" cy="140" r="4" fill="#2563eb"/>
    <line class="layer-stage-3 formal-labels" x1="50" y1="140" x2="210" y2="30" stroke="#ea580c" stroke-width="2"/>
    <text class="layer-stage-3 formal-labels" x="80" y="132" font-size="10" font-weight="bold" fill="#ea580c">Angle α</text>
    <text class="layer-stage-4" x="130" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Distance d</text>
    <text class="layer-stage-4" x="130" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Elevation Model: h = d · tan α</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Solving elevation, depression</tspan>
    <tspan x="200" dy="14">angles and slopes via right triangle models</tspan>
  </text>
</svg>
