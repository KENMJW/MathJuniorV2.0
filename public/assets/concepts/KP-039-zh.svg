<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-039 · 二次函数</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">二次函数的对称轴与顶点</text>

  <!-- Core Content Graphic -->
  <g transform="translate(45, 68)">
    <line class="layer-stage-1" x1="15" y1="130" x2="285" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
    <line class="layer-stage-1" x1="60" y1="15" x2="60" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Parabola opening up -->
    <path class="layer-stage-2" d="M70,30 Q150,180 230,30" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <!-- Axis of symmetry line -->
    <line class="layer-stage-3 formal-labels" x1="150" y1="15" x2="150" y2="155" stroke="#ea580c" stroke-width="2" stroke-dasharray="3 3"/>
    <text class="layer-stage-3 formal-labels" x="150" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#ea580c">对称轴 x = -b/(2a)</text>
    <!-- Vertex V(h, k) -->
    <circle class="layer-stage-4" cx="150" cy="105" r="5" fill="#dc2626"/>
    <text class="layer-stage-4" x="150" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">顶点 (h, k)</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">抛物线对称轴为 x = -b/(2a)，顶点坐标为</tspan>
    <tspan x="200" dy="14">(-b/(2a), (4ac-b²)/(4a))</tspan>
  </text>
</svg>
