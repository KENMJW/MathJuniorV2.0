<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-043 · 函数建模</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">函数的实际应用与建模</text>

  <!-- Core Content Graphic -->
  <g transform="translate(45, 68)">
    <!-- Water surface / x-axis -->
    <line class="layer-stage-1" x1="20" y1="130" x2="280" y2="130" stroke="#0284c7" stroke-width="2"/>
    <text class="layer-stage-1" x="280" y="145" font-size="11" fill="#0284c7">水面 (x轴)</text>
    <!-- Bridge Arch -->
    <path class="layer-stage-2" d="M50,130 Q150,20 250,130" fill="none" stroke="#475569" stroke-width="3"/>
    <!-- Arch height h -->
    <line class="layer-stage-3 formal-labels" x1="150" y1="130" x2="150" y2="48" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text class="layer-stage-3 formal-labels" x="158" y="90" font-size="11" font-weight="bold" fill="#dc2626">拱高 h</text>
    <!-- Span L -->
    <line class="layer-stage-4" x1="50" y1="140" x2="250" y2="140" stroke="#16a34a" stroke-width="2"/>
    <text class="layer-stage-4" x="150" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">跨径跨度 L</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="270" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">建立直角坐标系将拱桥跨度与拱高转化为抛物线解析式求解</text>
</svg>
