<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-102 · Data Analysis</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Statistical Decision Making</text>

  <!-- Core Content Graphic -->
  <g transform="translate(50, 68)">
    <line class="layer-stage-1" x1="20" y1="130" x2="250" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
    <text class="layer-stage-1" x="255" y="135" font-size="10" fill="#64748b">Mean</text>
    <line class="layer-stage-1" x1="40" y1="20" x2="40" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
    <text class="layer-stage-1" x="35" y="15" font-size="10" fill="#64748b">Variance</text>
    <circle class="layer-stage-2" cx="200" cy="100" r="7" fill="#16a34a"/>
    <text class="layer-stage-3 formal-labels" x="200" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Player A (Best)</text>
    <circle class="layer-stage-2" cx="200" cy="45" r="6" fill="#ea580c"/>
    <text class="layer-stage-3 formal-labels" x="200" y="35" text-anchor="middle" font-size="10" fill="#c2410c">Player B</text>
    <text class="layer-stage-4" x="140" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">Criteria: High Mean (Ability) + Low Variance (Stability)</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Comprehensive decisions</tspan>
    <tspan x="200" dy="14">combining mean (strength) and variance (stability)</tspan>
  </text>
</svg>
