<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-060 · 相似图形</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">位似图形与位似变换</text>

  <!-- Core Content Graphic -->
  <g transform="translate(45, 68)">
    <!-- Homothetic center O -->
    <circle class="layer-stage-1" cx="30" cy="130" r="5" fill="#dc2626"/>
    <text class="layer-stage-1" x="25" y="148" font-size="12" font-weight="bold" fill="#dc2626">O (位似中心)</text>
    <!-- Perspective rays -->
    <line class="layer-stage-2" x1="30" y1="130" x2="260" y2="30" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line class="layer-stage-2" x1="30" y1="130" x2="260" y2="90" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line class="layer-stage-2" x1="30" y1="130" x2="260" y2="150" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Small triangle -->
    <polygon class="layer-stage-3 formal-labels" points="110,95 110,115 130,123" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <!-- Large homothetic triangle -->
    <polygon class="layer-stage-4" points="200,55 200,105 245,125" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text class="layer-stage-4" x="150" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">位似变换: 对应点连线交于位似中心 O</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">对应顶点的连线相交于一点且对应边</tspan>
    <tspan x="200" dy="14">平行的两个相似多边形叫做位似图形</tspan>
  </text>
</svg>
