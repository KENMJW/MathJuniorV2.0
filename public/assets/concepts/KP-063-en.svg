<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-063 · Quadrilaterals</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Criteria for Parallelograms</text>

  <!-- Core Content Graphic -->
  <g transform="translate(50, 68)">
    <polygon class="layer-stage-1" points="60,35 210,35 180,135 30,135" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <polygon class="layer-stage-2" points="135,35 127,31 127,39" fill="#15803d"/>
    <polygon class="layer-stage-2" points="105,135 97,131 97,139" fill="#15803d"/>
    <line class="layer-stage-3 formal-labels" x1="135" y1="30" x2="135" y2="40" stroke="#dc2626" stroke-width="2"/>
    <line class="layer-stage-3 formal-labels" x1="105" y1="130" x2="105" y2="140" stroke="#dc2626" stroke-width="2"/>
    <text class="layer-stage-4" x="120" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">AD ∥ BC and AD = BC</text>
    <text class="layer-stage-4" x="120" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Criteria: One pair of opposite sides parallel and equal</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">One pair of opposite sides</tspan>
    <tspan x="200" dy="14">parallel and equal defines a parallelogram</tspan>
  </text>
</svg>
