<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-083 · Transformations</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Composite Transformations</text>

  <!-- Core Content Graphic -->
  <g transform="translate(50, 68)">
    <rect class="layer-stage-1" x="20" y="35" width="220" height="90" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <line class="layer-stage-2" x1="120" y1="35" x2="160" y2="125" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="3 3"/>
    <text class="layer-stage-2" x="110" y="28" font-size="10" font-weight="bold" fill="#dc2626">Crease E</text>
    <text class="layer-stage-2" x="165" y="138" font-size="10" font-weight="bold" fill="#dc2626">F</text>
    <polygon class="layer-stage-3 formal-labels" points="120,35 160,125 90,145 50,55" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text class="layer-stage-4" x="130" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Origami: Fold crease acts as symmetry axis, preserving congruence</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Paper folding corresponds to</tspan>
    <tspan x="200" dy="14">axial symmetry; length and angle are conserved</tspan>
  </text>
</svg>
