<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-018 · 分式方程</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">分式方程的解法与增根检验</text>

  <!-- Core Content Graphic -->
  <g transform="translate(35, 80)">
    <line class="layer-stage-1" x1="20" y1="70" x2="310" y2="70" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Candidate root x=2 (Valid) -->
    <circle class="layer-stage-1" cx="90" cy="70" r="5" fill="#16a34a"/>
    <text class="layer-stage-1" x="90" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">x = 2 (原方程的根)</text>
    <!-- Extraneous root x=3 (Denied) -->
    <circle class="layer-stage-2" cx="220" cy="70" r="5" fill="#dc2626"/>
    <!-- Red cross over x=3 -->
    <path class="layer-stage-3 formal-labels" d="M212,62 L228,78 M228,62 L212,78" stroke="#dc2626" stroke-width="2.5"/>
    <text class="layer-stage-3 formal-labels" x="220" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">x = 3 (增根舍去)</text>
    <text class="layer-stage-4" x="220" y="45" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">使最简公分母 x-3 = 0</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="270" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">解分式方程必须验根：代入最简公分母，若为零则是增根必须舍去</text>
</svg>
