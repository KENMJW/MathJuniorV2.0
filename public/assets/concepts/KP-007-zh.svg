<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-007 · 实数</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">立方根</text>

  <!-- Core Content Graphic -->
  <g transform="translate(80, 70)">
    <!-- Isometric Cube: front face -->
    <rect class="layer-stage-1" x="30" y="50" width="70" height="70" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <!-- Top face -->
    <polygon class="layer-stage-2" points="30,50 65,20 135,20 100,50" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <!-- Right face -->
    <polygon class="layer-stage-2" points="100,50 135,20 135,90 100,120" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>
    <text class="layer-stage-3 formal-labels" x="65" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">体积 V</text>
    <text class="layer-stage-4" x="155" y="65" font-size="12" font-weight="bold" fill="#1d4ed8">棱长 x = ∛V</text>
    <text class="layer-stage-4" x="155" y="90" font-size="11" fill="#475569">x³ = a (唯一实根)</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="270" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">任何实数都有且只有一个立方根，正数的立方根为正，负数的为负</text>
</svg>
