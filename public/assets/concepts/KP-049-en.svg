<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-049 · Triangles</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Triangle Properties</text>

  <!-- Core Content Graphic -->
  <g transform="translate(50, 68)">
    <polygon class="layer-stage-1" points="130,45 40,140 220,140" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <line class="layer-stage-2" x1="20" y1="45" x2="240" y2="45" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text class="layer-stage-2" x="245" y="48" font-size="10" fill="#ea580c">l ∥ BC</text>
    <text class="layer-stage-3 formal-labels" x="90" y="40" font-size="10" font-weight="bold" fill="#dc2626">∠B</text>
    <text class="layer-stage-3 formal-labels" x="130" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">∠A</text>
    <text class="layer-stage-3 formal-labels" x="170" y="40" font-size="10" font-weight="bold" fill="#16a34a">∠C</text>
    <text class="layer-stage-4" x="130" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Angle Sum Theorem: ∠A + ∠B + ∠C = 180°</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Interior angles sum to 180</tspan>
    <tspan x="200" dy="14">degrees; exterior angle equals two non-adjacent interiors</tspan>
  </text>
</svg>
