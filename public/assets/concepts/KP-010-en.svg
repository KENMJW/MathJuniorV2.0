<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-010 · Algebra</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Polynomial Addition &amp; Subtraction</text>

  <!-- Core Content Graphic -->
  <g transform="translate(45, 75)">
    <rect class="layer-stage-1" x="30" y="30" width="120" height="35" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text class="layer-stage-1" x="90" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">3a (Like Terms)</text>
    <rect class="layer-stage-2" x="155" y="30" width="80" height="35" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
    <text class="layer-stage-2" x="195" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">2a</text>
    <path class="layer-stage-3 formal-labels" d="M140,75 L140,95" stroke="#475569" stroke-width="2"/>
    <rect class="layer-stage-4" x="30" y="105" width="205" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text class="layer-stage-4" x="132" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Combined = (3 + 2)a = 5a</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Combining like terms: add</tspan>
    <tspan x="200" dy="14">coefficients while keeping variables constant</tspan>
  </text>
</svg>
