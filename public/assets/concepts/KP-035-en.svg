<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-035 · Functions</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Linear Functions &amp; Inequalities</text>

  <!-- Core Content Graphic -->
  <g transform="translate(50, 70)">
    <line class="layer-stage-1" x1="20" y1="95" x2="260" y2="95" stroke="#94a3b8" stroke-width="1.5"/>
    <line class="layer-stage-1" x1="70" y1="20" x2="70" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
    <line class="layer-stage-2" x1="40" y1="140" x2="230" y2="45" stroke="#2563eb" stroke-width="2.5"/>
    <circle class="layer-stage-3 formal-labels" cx="130" cy="95" r="5" fill="#dc2626"/>
    <text class="layer-stage-3 formal-labels" x="130" y="115" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">x₀ (Root kx+b=0)</text>
    <polygon class="layer-stage-4" points="130,95 230,45 230,95" fill="#dcfce7" opacity="0.6"/>
    <text class="layer-stage-4" x="190" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">kx+b &gt; 0 (x &gt; x₀)</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">X-intercept gives equation</tspan>
    <tspan x="200" dy="14">root; portion above axis gives inequality solution</tspan>
  </text>
</svg>
