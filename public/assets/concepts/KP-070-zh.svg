<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-070 · 圆</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">点与圆的位置关系</text>

  <!-- Core Content Graphic -->
  <g transform="translate(60, 68)">
    <circle class="layer-stage-1" cx="140" cy="85" r="55" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <circle class="layer-stage-1" cx="140" cy="85" r="4" fill="#475569"/>
    <text class="layer-stage-1" x="140" y="102" text-anchor="middle" font-size="11">O</text>
    <!-- Point A inside (d < r) -->
    <circle class="layer-stage-2" cx="120" cy="65" r="5" fill="#2563eb"/>
    <text class="layer-stage-2" x="110" y="60" font-size="11" font-weight="bold" fill="#2563eb">A(点在圆内 d&lt;r)</text>
    <!-- Point B on circle (d = r) -->
    <circle class="layer-stage-3 formal-labels" cx="195" cy="85" r="5" fill="#16a34a"/>
    <text class="layer-stage-3 formal-labels" x="205" y="85" font-size="11" font-weight="bold" fill="#15803d">B(圆上 d=r)</text>
    <!-- Point C outside (d > r) -->
    <circle class="layer-stage-4" cx="225" cy="40" r="5" fill="#dc2626"/>
    <text class="layer-stage-4" x="235" y="40" font-size="11" font-weight="bold" fill="#dc2626">C(圆外 d&gt;r)</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">根据点到圆心距离 d 与半径 r 的大小关系判定：d&lt;r</tspan>
    <tspan x="200" dy="14">圆内，d=r 圆上，d&gt;r 圆外</tspan>
  </text>
</svg>
