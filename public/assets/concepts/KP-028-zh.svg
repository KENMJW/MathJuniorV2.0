<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-028 · 一元一次不等式</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">一元一次不等式的解法</text>

  <!-- Core Content Graphic -->
  <g transform="translate(35, 80)">
    <line class="layer-stage-1" x1="20" y1="70" x2="310" y2="70" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon class="layer-stage-1" points="315,70 305,65 305,75" fill="#94a3b8"/>
    <!-- Solid boundary point a -->
    <circle class="layer-stage-2" cx="110" cy="70" r="6" fill="#2563eb"/>
    <text class="layer-stage-2" x="110" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">a (实心包含点)</text>
    <!-- Directed ray x >= a -->
    <line class="layer-stage-3 formal-labels" x1="110" y1="70" x2="280" y2="70" stroke="#2563eb" stroke-width="4"/>
    <polygon class="layer-stage-3 formal-labels" points="285,70 275,64 275,76" fill="#2563eb"/>
    <text class="layer-stage-4" x="200" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">解集射线: x ≥ a</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="270" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">在数轴上表示解集：大于向右画，小于向左画，有等号画实心点</text>
</svg>
