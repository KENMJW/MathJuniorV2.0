<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-066 · Quadrilaterals</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Square Properties &amp; Criteria</text>

  <!-- Core Content Graphic -->
  <g transform="translate(65, 68)">
    <rect class="layer-stage-1" x="25" y="25" width="120" height="120" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect class="layer-stage-2" x="25" y="25" width="12" height="12" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    <rect class="layer-stage-2" x="133" y="25" width="12" height="12" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    <rect class="layer-stage-2" x="133" y="133" width="12" height="12" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    <rect class="layer-stage-2" x="25" y="133" width="12" height="12" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    <line class="layer-stage-3 formal-labels" x1="25" y1="25" x2="145" y2="145" stroke="#dc2626" stroke-width="2"/>
    <line class="layer-stage-3 formal-labels" x1="145" y1="25" x2="25" y2="145" stroke="#dc2626" stroke-width="2"/>
    <text class="layer-stage-4" x="85" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Square: Rectangle + Rhombus (Fully Symmetric)</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Square combines rectangle and</tspan>
    <tspan x="200" dy="14">rhombus properties: 4 equal sides &amp; right angles</tspan>
  </text>
</svg>
