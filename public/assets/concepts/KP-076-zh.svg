<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-076 · 圆</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">三角形的内切圆与外接圆</text>

  <!-- Core Content Graphic -->
  <g transform="translate(50, 68)">
    <polygon class="layer-stage-1" points="130,20 40,140 220,140" fill="none" stroke="#2563eb" stroke-width="2"/>
    <!-- Inscribed circle touching sides -->
    <circle class="layer-stage-2" cx="130" cy="95" r="35" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <circle class="layer-stage-2" cx="130" cy="95" r="4" fill="#15803d"/>
    <text class="layer-stage-3 formal-labels" x="130" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">内心 I</text>
    <text class="layer-stage-4" x="130" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">内心: 三内角平分线交点 (到三边距离相等)</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="270" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">内心是三角形三内角平分线的交点；外心是三边垂直平分线的交点</text>
</svg>
