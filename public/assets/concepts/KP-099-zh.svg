<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-099 · 数据特征</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">众数</text>

  <!-- Core Content Graphic -->
  <g transform="translate(45, 68)">
    <line class="layer-stage-1" x1="20" y1="135" x2="270" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
    <rect class="layer-stage-2" x="50" y="90" width="35" height="45" fill="#93c5fd"/>
    <!-- Peak Bar (Mode) -->
    <rect class="layer-stage-3 formal-labels" x="100" y="30" width="35" height="105" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
    <text class="layer-stage-3 formal-labels" x="117" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">最高频次 (众数)</text>
    <rect class="layer-stage-2" x="150" y="70" width="35" height="65" fill="#93c5fd"/>
    <rect class="layer-stage-2" x="200" y="100" width="35" height="35" fill="#93c5fd"/>
    <text class="layer-stage-4" x="145" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">出现次数最多的数值 (可有多个或无)</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">一组数据中出现次数最多的数值叫</tspan>
    <tspan x="200" dy="14">做众数，反映大多数数据的集中趋势</tspan>
  </text>
</svg>
