<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-052 · Congruence</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Properties of Congruent Triangles</text>

  <!-- Core Content Graphic -->
  <g transform="translate(45, 68)">
    <polygon class="layer-stage-1" points="70,30 20,135 120,135" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <line class="layer-stage-2" x1="70" y1="30" x2="70" y2="135" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text class="layer-stage-2" x="78" y="85" font-size="10" font-weight="bold" fill="#dc2626">h₁</text>
    <polygon class="layer-stage-3 formal-labels" points="210,30 160,135 260,135" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <line class="layer-stage-3 formal-labels" x1="210" y1="30" x2="210" y2="135" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text class="layer-stage-3 formal-labels" x="218" y="85" font-size="10" font-weight="bold" fill="#dc2626">h₂</text>
    <text class="layer-stage-4" x="140" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Congruence: Corresponding sides, angles and altitudes equal</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Congruent triangles have</tspan>
    <tspan x="200" dy="14">equal corresponding angles, sides and altitudes</tspan>
  </text>
</svg>
