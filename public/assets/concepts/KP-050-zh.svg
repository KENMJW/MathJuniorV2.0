<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-050 · 三角形</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">三角形的三边关系</text>

  <!-- Core Content Graphic -->
  <g transform="translate(50, 68)">
    <polygon class="layer-stage-1" points="120,30 30,130 230,130" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text class="layer-stage-2" x="65" y="75" font-size="13" font-weight="bold" fill="#15803d">边 a</text>
    <text class="layer-stage-2" x="180" y="75" font-size="13" font-weight="bold" fill="#15803d">边 b</text>
    <text class="layer-stage-3 formal-labels" x="130" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">边 c (底边)</text>
    <text class="layer-stage-4" x="130" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">a + b &gt; c 且 |a - b| &lt; c</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="270" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">三角形任意两边之和大于第三边，任意两边之差小于第三边</text>
</svg>
