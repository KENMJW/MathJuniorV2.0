<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-006 · 实数</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">平方根与算术平方根</text>

  <!-- Core Content Graphic -->
  <g transform="translate(60, 75)">
    <!-- Square with area a -->
    <rect class="layer-stage-1" x="30" y="20" width="110" height="110" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text class="layer-stage-2" x="85" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#15803d">面积 = a (a≥0)</text>
    <line class="layer-stage-3 formal-labels" x1="30" y1="140" x2="140" y2="140" stroke="#2563eb" stroke-width="2"/>
    <text class="layer-stage-3 formal-labels" x="85" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">边长 x = √a</text>
    <text class="layer-stage-4" x="190" y="70" font-size="12" font-weight="bold" fill="#dc2626">若 x² = a</text>
    <text class="layer-stage-4" x="190" y="95" font-size="12" font-weight="bold" fill="#dc2626">则 x = ±√a</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="270" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">正数有两个互为相反数的平方根，其中正根 √a 为算术平方根</text>
</svg>
