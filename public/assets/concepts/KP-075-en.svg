<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-075 · Circles</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Positions of Two Circles</text>

  <!-- Core Content Graphic -->
  <g transform="translate(45, 68)">
    <circle class="layer-stage-1" cx="95" cy="85" r="45" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle class="layer-stage-1" cx="95" cy="85" r="4" fill="#1e40af"/>
    <text class="layer-stage-1" x="95" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">O₁</text>
    <circle class="layer-stage-2" cx="170" cy="85" r="30" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <circle class="layer-stage-2" cx="170" cy="85" r="4" fill="#15803d"/>
    <text class="layer-stage-2" x="170" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">O₂</text>
    <line class="layer-stage-3 formal-labels" x1="95" y1="85" x2="170" y2="85" stroke="#dc2626" stroke-width="2.5"/>
    <circle class="layer-stage-3 formal-labels" cx="140" cy="85" r="4" fill="#dc2626"/>
    <text class="layer-stage-4" x="135" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">External Tangency: d = R + r</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Five positions governed by</tspan>
    <tspan x="200" dy="14">distance between centers d vs radii R ± r</tspan>
  </text>
</svg>
