<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-050 · Triangles</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Triangle Inequality Theorem</text>

  <!-- Core Content Graphic -->
  <g transform="translate(50, 68)">
    <polygon class="layer-stage-1" points="120,30 30,130 230,130" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text class="layer-stage-2" x="65" y="75" font-size="12" font-weight="bold" fill="#15803d">Side a</text>
    <text class="layer-stage-2" x="180" y="75" font-size="12" font-weight="bold" fill="#15803d">Side b</text>
    <text class="layer-stage-3 formal-labels" x="130" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">Side c</text>
    <text class="layer-stage-4" x="130" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">a + b &gt; c and |a - b| &lt; c</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Sum of any two sides is</tspan>
    <tspan x="200" dy="14">greater than the third; difference is less</tspan>
  </text>
</svg>
