<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-089 · Trigonometry</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Complementary Angle Relations</text>

  <!-- Core Content Graphic -->
  <g transform="translate(60, 68)">
    <polygon class="layer-stage-1" points="40,140 220,140 220,40" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect class="layer-stage-1" x="208" y="128" width="12" height="12" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <text class="layer-stage-2" x="65" y="132" font-size="11" font-weight="bold" fill="#2563eb">∠A</text>
    <text class="layer-stage-2" x="205" y="60" font-size="11" font-weight="bold" fill="#dc2626">∠B</text>
    <text class="layer-stage-3 formal-labels" x="130" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">∠A + ∠B = 90°</text>
    <text class="layer-stage-4" x="130" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">Complementary: sin A = cos B, tan A · tan B = 1</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Complementary angles: sin A =</tspan>
    <tspan x="200" dy="14">cos B, cos A = sin B, tan A · tan B = 1</tspan>
  </text>
</svg>
