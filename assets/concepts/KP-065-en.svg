<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-065 · Quadrilaterals</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Rhombus Properties &amp; Criteria</text>

  <!-- Core Content Graphic -->
  <g transform="translate(60, 68)">
    <polygon class="layer-stage-1" points="110,20 190,85 110,150 30,85" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <line class="layer-stage-2" x1="110" y1="20" x2="110" y2="150" stroke="#dc2626" stroke-width="2"/>
    <line class="layer-stage-2" x1="30" y1="85" x2="190" y2="85" stroke="#dc2626" stroke-width="2"/>
    <rect class="layer-stage-3 formal-labels" x="110" y="75" width="10" height="10" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <text class="layer-stage-4" x="110" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">All 4 sides equal; Diagonals AC ⊥ BD bisect angles</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">All sides equal; diagonals</tspan>
    <tspan x="200" dy="14">are perpendicular bisectors of each other</tspan>
  </text>
</svg>
