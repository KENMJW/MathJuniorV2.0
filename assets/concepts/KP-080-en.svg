<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-080 · Transformations</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Translation Transformation</text>

  <!-- Core Content Graphic -->
  <g transform="translate(50, 68)">
    <polygon class="layer-stage-1" points="30,120 110,120 80,40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <polygon class="layer-stage-2" points="150,120 230,120 200,40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <path class="layer-stage-3 formal-labels" d="M80,40 L195,40" stroke="#3b82f6" stroke-width="2"/>
    <path class="layer-stage-3 formal-labels" d="M110,120 L225,120" stroke="#3b82f6" stroke-width="2"/>
    <path class="layer-stage-3 formal-labels" d="M30,120 L145,120" stroke="#3b82f6" stroke-width="2"/>
    <text class="layer-stage-4" x="80" y="32" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">A</text>
    <text class="layer-stage-4" x="200" y="32" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">A'</text>
    <text class="layer-stage-4" x="140" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">Vector v</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Translation preserves</tspan>
    <tspan x="200" dy="14">isometry: corresponding segments are parallel and equal</tspan>
  </text>
</svg>
