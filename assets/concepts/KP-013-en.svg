<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-013 · Algebra</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Polynomial Division</text>

  <!-- Core Content Graphic -->
  <g transform="translate(50, 75)">
    <rect class="layer-stage-1" x="30" y="25" width="200" height="85" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text class="layer-stage-2" x="130" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Total Area = 6x²y + 4xy²</text>
    <line class="layer-stage-3 formal-labels" x1="15" y1="25" x2="15" y2="110" stroke="#0284c7" stroke-width="2"/>
    <text class="layer-stage-3 formal-labels" x="8" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#0284c7">Width 2xy</text>
    <path class="layer-stage-4" d="M30,125 L230,125" stroke="#16a34a" stroke-width="2"/>
    <text class="layer-stage-4" x="130" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">Length = 3x + 2y</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Dividing polynomial by</tspan>
    <tspan x="200" dy="14">monomial: divide each term and combine</tspan>
  </text>
</svg>
