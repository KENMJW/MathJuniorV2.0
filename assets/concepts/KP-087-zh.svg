<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-087 · 锐角三角函数</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">正切tan的定义与计算</text>

  <!-- Core Content Graphic -->
  <g transform="translate(60, 68)">
    <polygon class="layer-stage-1" points="40,140 220,140 220,40" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <rect class="layer-stage-1" x="208" y="128" width="12" height="12" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
    <!-- Highlighted legs a and b -->
    <line class="layer-stage-2" x1="220" y1="40" x2="220" y2="140" stroke="#dc2626" stroke-width="3.5"/>
    <text class="layer-stage-2" x="235" y="95" font-size="12" font-weight="bold" fill="#dc2626">对边 a (垂直高度)</text>
    <line class="layer-stage-3 formal-labels" x1="40" y1="140" x2="220" y2="140" stroke="#2563eb" stroke-width="3.5"/>
    <text class="layer-stage-3 formal-labels" x="130" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">邻边 b (水平宽度)</text>
    <!-- Slope interpretation -->
    <text class="layer-stage-4" x="130" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">正切 (坡度 i): tan A = 对边 / 邻边 = a / b</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">在直角三角形中，锐角 A 的对边与邻边的比叫做角 A</tspan>
    <tspan x="200" dy="14">的正切 tan A = a/b</tspan>
  </text>
</svg>
