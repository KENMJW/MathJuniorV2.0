<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-078 · Circles</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Regular Polygons and Circles</text>

  <!-- Core Content Graphic -->
  <g transform="translate(60, 68)">
    <circle class="layer-stage-1" cx="140" cy="85" r="55" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon class="layer-stage-2" points="195,85 167,132 112,132 85,85 112,37 167,37" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <circle class="layer-stage-3 formal-labels" cx="140" cy="85" r="4" fill="#dc2626"/>
    <line class="layer-stage-3 formal-labels" x1="140" y1="85" x2="167" y2="37" stroke="#dc2626" stroke-width="1.5"/>
    <line class="layer-stage-3 formal-labels" x1="140" y1="85" x2="112" y2="37" stroke="#dc2626" stroke-width="1.5"/>
    <text class="layer-stage-4" x="140" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">Central Angle 60°</text>
    <text class="layer-stage-4" x="140" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Hexagon: Side length equals circumradius R</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Central angle is 360/n</tspan>
    <tspan x="200" dy="14">degrees; radius and apothem form right triangle</tspan>
  </text>
</svg>
