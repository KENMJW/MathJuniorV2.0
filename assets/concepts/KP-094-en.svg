<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-094 · 数据收集整理</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Sector Graphs (Pie Charts)</text>


  <!-- Statistical Histogram / Distribution -->
  <g transform="translate(70, 90)">
    <!-- Axis -->
    <line x1="20" y1="130" x2="250" y2="130" stroke="#1d1d1f" stroke-width="2"/>
    <line x1="20" y1="20" x2="20" y2="130" stroke="#1d1d1f" stroke-width="2"/>
    <!-- Bars -->
    <rect x="35" y="80" width="35" height="50" fill="#0071e3" fill-opacity="0.3" stroke="#0071e3" stroke-width="1.5"/>
    <rect x="75" y="45" width="35" height="85" fill="#0071e3" fill-opacity="0.5" stroke="#0071e3" stroke-width="1.5"/>
    <rect x="115" y="25" width="35" height="105" fill="#0071e3" fill-opacity="0.8" stroke="#0071e3" stroke-width="1.5"/>
    <rect x="155" y="55" width="35" height="75" fill="#0071e3" fill-opacity="0.5" stroke="#0071e3" stroke-width="1.5"/>
    <rect x="195" y="90" width="35" height="40" fill="#0071e3" fill-opacity="0.3" stroke="#0071e3" stroke-width="1.5"/>
    <!-- Mean line -->
    <line x1="132" y1="15" x2="132" y2="130" stroke="#ff3b30" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="135" y="18" font-size="12" font-weight="bold" fill="#ff3b30">x̄</text>
  </g>
  <text x="200" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">Central Tendency &amp; Dispersion (Variance)</text>

</svg>