<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-054 · Triangles</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Criteria for Isosceles Triangles</text>

  <!-- Core Content Graphic -->
  <g transform="translate(60, 68)">
    <polygon class="layer-stage-1" points="130,25 35,145 225,145" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <path class="layer-stage-2" d="M60,145 A25,25 0 0,0 52,125" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <text class="layer-stage-2" x="70" y="135" font-size="11" font-weight="bold" fill="#dc2626">∠B</text>
    <path class="layer-stage-2" d="M200,145 A25,25 0 0,1 208,125" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <text class="layer-stage-2" x="190" y="135" font-size="11" font-weight="bold" fill="#dc2626">∠C</text>
    <text class="layer-stage-3 formal-labels" x="70" y="75" font-size="11" font-weight="bold" fill="#2563eb">AB</text>
    <text class="layer-stage-3 formal-labels" x="185" y="75" font-size="11" font-weight="bold" fill="#2563eb">AC</text>
    <text class="layer-stage-4" x="130" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Theorem: If ∠B = ∠C, then AB = AC</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Equal angles subtend equal</tspan>
    <tspan x="200" dy="14">sides: ∠B = ∠C implies AB = AC</tspan>
  </text>
</svg>
