<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-015 · 代数式</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Simplification and Operations of Quadratic Radicals</text>


  <!-- Geometric Algebra Dissection: (a+b)^2 = a^2 + 2ab + b^2 -->
  <g transform="translate(110, 85)">
    <!-- a^2 -->
    <rect class="layer-stage-1" x="0" y="0" width="110" height="110" fill="#0071e3" fill-opacity="0.2" stroke="#0071e3" stroke-width="2" />
    <text class="layer-stage-3 formal-labels" x="55" y="60" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0071e3">a²</text>
    <!-- ab top-right -->
    <rect class="layer-stage-2" x="110" y="0" width="60" height="110" fill="#34c759" fill-opacity="0.2" stroke="#34c759" stroke-width="2" />
    <text class="layer-stage-3 formal-labels" x="140" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34c759">ab</text>
    <!-- ab bottom-left -->
    <rect class="layer-stage-2" x="0" y="110" width="110" height="60" fill="#34c759" fill-opacity="0.2" stroke="#34c759" stroke-width="2" />
    <text class="layer-stage-3 formal-labels" x="55" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34c759">ab</text>
    <!-- b^2 bottom-right -->
    <rect class="layer-stage-2" x="110" y="110" width="60" height="60" fill="#ff9500" fill-opacity="0.2" stroke="#ff9500" stroke-width="2" />
    <text class="layer-stage-3 formal-labels" x="140" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ff9500">b²</text>
  </g>
  <text class="layer-stage-4" x="200" y="275" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#1d1d1f">(a + b)² = a² + 2ab + b²</text>

</svg>