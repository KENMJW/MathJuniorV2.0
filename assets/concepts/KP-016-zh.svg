<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-016 · 分式</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">分式的基本性质</text>


  <!-- Rational Expressions Structure -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="240" height="120" rx="14" fill="#f8fafc" stroke="#e5e5ea" stroke-width="2"/>
    <text x="120" y="45" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#0071e3">A(x)</text>
    <line x1="50" y1="60" x2="190" y2="60" stroke="#1d1d1f" stroke-width="3"/>
    <text x="120" y="95" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#ff9500">B(x)</text>
  </g>
  <text x="200" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ff3b30">B(x) ≠ 0 (分母非零根基)</text>

</svg>