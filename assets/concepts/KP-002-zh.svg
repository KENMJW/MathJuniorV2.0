<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-002 · 实数</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">数轴 · 几何结构模型</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- 基础数轴基底 (各阶段永久可见) -->
  <line x1="30" y1="165" x2="365" y2="165" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="372" y="162" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">+</text>

  <!-- 统一刻度: 原点处于 195, 间距 42px (-3 ~ +3) -->
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="69" y1="158" x2="69" y2="172" />
    <line x1="111" y1="158" x2="111" y2="172" />
    <line x1="153" y1="158" x2="153" y2="172" />
    <!-- 原点 0 醒目粗线 -->
    <line x1="195" y1="152" x2="195" y2="178" stroke="#0071e3" stroke-width="3" />
    <line x1="237" y1="158" x2="237" y2="172" />
    <line x1="279" y1="158" x2="279" y2="172" />
    <line x1="321" y1="158" x2="321" y2="172" />
  </g>

  <!-- 数字标注 (永久可见) -->
  <text x="69" y="190" text-anchor="middle" font-size="12" font-family="monospace" fill="#64748b">-3</text>
  <text x="111" y="190" text-anchor="middle" font-size="12" font-family="monospace" fill="#64748b">-2</text>
  <text x="153" y="190" text-anchor="middle" font-size="12" font-family="monospace" fill="#64748b">-1</text>
  <circle cx="195" cy="165" r="4.5" fill="#0071e3" />
  <text x="195" y="192" text-anchor="middle" font-size="14" font-weight="bold" font-family="monospace" fill="#0071e3">0</text>
  <text x="237" y="190" text-anchor="middle" font-size="12" font-family="monospace" fill="#64748b">1</text>
  <text x="279" y="190" text-anchor="middle" font-size="12" font-family="monospace" fill="#64748b">2</text>
  <text x="321" y="190" text-anchor="middle" font-size="12" font-family="monospace" fill="#64748b">3</text>

  <!-- ===== 图层 1: 现实度量原型 (layer-stage-1) ===== -->
  <g class="layer-stage-1">
    <rect x="150" y="75" width="90" height="24" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="195" y="91" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0369a1">0℃ 冰水混合点</text>
    <path d="M 195 100 L 195 148" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,2"/>
    <path d="M 245 125 L 310 125" stroke="#0071e3" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="278" y="117" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0071e3">正方向 (+)</text>
    <text x="195" y="215" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0369a1">基准原点 O</text>
  </g>

  <!-- ===== 图层 2: 本真透视 · 几何骨架 (layer-stage-2) ===== -->
  <g class="layer-stage-2">
    <path d="M 111 155 Q 195 70 279 155" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="4,3"/>
    <circle cx="111" cy="165" r="5" fill="#8b5cf6" />
    <circle cx="279" cy="165" r="5" fill="#8b5cf6" />
    <rect x="155" y="65" width="80" height="22" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
    <text x="195" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">关于 0 轴对称</text>
    <rect x="195" y="148" width="42" height="34" fill="#38bdf8" opacity="0.2"/>
    <text x="216" y="138" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#0284c7">单位 1</text>
    <rect x="75" y="225" width="240" height="26" rx="13" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="195" y="242" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#047857">右侧点永远大于左侧点 (2 > -2)</text>
  </g>

  <!-- ===== 图层 3: 法典严定 · 核心定理模型 (layer-stage-3, formal-labels) ===== -->
  <g class="layer-stage-3 formal-labels">
    <circle cx="153" cy="165" r="5" fill="#f59e0b" />
    <text x="153" y="142" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#d97706">A(-1)</text>
    <circle cx="279" cy="165" r="5" fill="#f59e0b" />
    <text x="279" y="142" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#d97706">B(2)</text>
    <path d="M 153 148 Q 216 85 279 148" fill="none" stroke="#d97706" stroke-width="2.5"/>
    <rect x="160" y="80" width="112" height="22" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="216" y="95" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#b45309">AB = 2 - (-1) = 3</text>

    <circle cx="216" cy="165" r="4.5" fill="#8b5cf6" />
    <line x1="216" y1="170" x2="216" y2="218" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="2,2"/>
    <rect x="171" y="222" width="90" height="22" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
    <text x="216" y="237" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">中点 M = 0.5</text>

    <path d="M 153 182 L 273 182" stroke="#d97706" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arr-amber)"/>
    <text x="216" y="198" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" fill="#d97706">P 位移: -1 + 2×1.5 = 2</text>
  </g>

  <!-- ===== 图层 4: 本体辨正 · 典型母题双解与警示 (layer-stage-4) ===== -->
  <g class="layer-stage-4">
    <circle cx="111" cy="165" r="5.5" fill="#0f172a" />
    <text x="111" y="138" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">A(-2)</text>

    <circle cx="237" cy="165" r="5" fill="#10b981" />
    <path d="M 111 148 Q 174 100 237 148" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
    <text x="174" y="105" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#047857">右解 P₁ = 1</text>

    <circle cx="50" cy="165" r="5" fill="#ef4444" />
    <path d="M 111 148 Q 80 100 50 148" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>
    <text x="75" y="105" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">左解 P₂ = -5</text>

    <rect x="60" y="226" width="270" height="28" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="195" y="244" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">核心考查点：距离双解 · 追及与超车</text>
  </g>
</svg>