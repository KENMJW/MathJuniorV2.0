<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-107 · Probability</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Estimating Probability by Frequen…</text>

  <!-- Core Content Graphic -->
  <g transform="translate(45, 68)">
    <line class="layer-stage-1" x1="20" y1="140" x2="270" y2="140" stroke="#94a3b8" stroke-width="1.5"/>
    <text class="layer-stage-1" x="275" y="145" font-size="10" fill="#64748b">Trials n</text>
    <line class="layer-stage-1" x1="40" y1="20" x2="40" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
    <line class="layer-stage-2" x1="40" y1="80" x2="270" y2="80" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4"/>
    <text class="layer-stage-2" x="275" y="85" font-size="10" font-weight="bold" fill="#dc2626">P = 0.5</text>
    <polyline class="layer-stage-3 formal-labels" points="40,120 70,45 100,105 130,65 170,90 210,75 250,81" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <text class="layer-stage-4" x="145" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">Law of Large Numbers: Frequency converges to theoretical probability</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">As trial count grows large,</tspan>
    <tspan x="200" dy="14">empirical frequency stabilizes around probability</tspan>
  </text>
</svg>
