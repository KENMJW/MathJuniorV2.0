<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-104 · Probability</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Probability Definition &amp; Properti…</text>

  <!-- Core Content Graphic -->
  <g transform="translate(60, 68)">
    <rect class="layer-stage-1" x="25" y="25" width="130" height="130" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text class="layer-stage-1" x="35" y="45" font-size="11" font-weight="bold" fill="#475569">Total Area S</text>
    <circle class="layer-stage-2" cx="90" cy="90" r="40" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text class="layer-stage-3 formal-labels" x="90" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">Target S₁</text>
    <text class="layer-stage-4" x="90" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Geometric Prob: P = S₁ / S</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Geometric probability: ratio</tspan>
    <tspan x="200" dy="14">of favorable area to total sample space area</tspan>
  </text>
</svg>
