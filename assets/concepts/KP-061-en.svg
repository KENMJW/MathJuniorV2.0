<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-061 · Polygons</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Polygon Angle Sums</text>

  <!-- Core Content Graphic -->
  <g transform="translate(50, 68)">
    <polygon class="layer-stage-1" points="130,20 40,65 70,145 190,145 220,65" fill="#fdf4ff" stroke="#a21caf" stroke-width="2"/>
    <line class="layer-stage-2" x1="130" y1="20" x2="70" y2="145" stroke="#a21caf" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line class="layer-stage-2" x1="130" y1="20" x2="190" y2="145" stroke="#a21caf" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text class="layer-stage-3 formal-labels" x="75" y="80" font-size="10" font-weight="bold" fill="#701a75">△1</text>
    <text class="layer-stage-3 formal-labels" x="130" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#701a75">△2</text>
    <text class="layer-stage-3 formal-labels" x="185" y="80" font-size="10" font-weight="bold" fill="#701a75">△3</text>
    <text class="layer-stage-4" x="130" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#a21caf">Interior Sum = (n - 2) × 180° = 540°</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Interior angles sum to</tspan>
    <tspan x="200" dy="14">(n-2)*180 degrees; exterior angles always sum to 360 degrees</tspan>
  </text>
</svg>
