<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-077 · 圆</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">弧长公式与扇形面积公式</text>

  <!-- Core Content Graphic -->
  <g transform="translate(60, 68)">
    <!-- Sector pie slice -->
    <path class="layer-stage-1" d="M140,120 L80,50 A85,85 0 0,1 200,50 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle class="layer-stage-1" cx="140" cy="120" r="4" fill="#b45309"/>
    <!-- Radius lines -->
    <text class="layer-stage-2" x="100" y="95" font-size="12" font-weight="bold" fill="#b45309">r</text>
    <text class="layer-stage-2" x="175" y="95" font-size="12" font-weight="bold" fill="#b45309">r</text>
    <!-- Central angle n -->
    <path class="layer-stage-3 formal-labels" d="M125,102 A20,20 0 0,1 155,102" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text class="layer-stage-3 formal-labels" x="140" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">n°</text>
    <!-- Arc length l -->
    <text class="layer-stage-4" x="140" y="38" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">弧长 l = nπr / 180</text>
    <text class="layer-stage-4" x="140" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">面积 S = (nπr²)/360 = lr/2</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">弧长公式 l = nπr/180，扇形面积公式 S =</tspan>
    <tspan x="200" dy="14">nπr²/360 = 1/2 lr</tspan>
  </text>
</svg>
