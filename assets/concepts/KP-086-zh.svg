<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-086 · 锐角三角函数</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">余弦cos的定义与计算</text>


  <!-- Trigonometric Ratio Right Triangle -->
  <g transform="translate(100, 90)">
    <polygon points="30,120 180,120 180,30" fill="#ff9500" fill-opacity="0.12" stroke="#ff9500" stroke-width="2.5"/>
    <rect x="162" y="102" width="18" height="18" fill="none" stroke="#1d1d1f" stroke-width="1.5"/>
    <!-- Angle alpha arc -->
    <path d="M 60 120 A 30 30 0 0 0 54 105" fill="none" stroke="#0071e3" stroke-width="2.5"/>
    <text x="65" y="112" font-size="13" font-weight="bold" fill="#0071e3">α</text>
    <text x="105" y="140" text-anchor="middle" font-size="12" fill="#86868b">邻边</text>
    <text x="195" y="78" text-anchor="start" font-size="12" fill="#86868b">对边</text>
    <text x="95" y="65" text-anchor="end" font-size="12" fill="#86868b">斜边</text>
  </g>
  <text x="200" y="268" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#1d1d1f">sin α = 对/斜,  cos α = 邻/斜,  tan α = 对/邻</text>

</svg>