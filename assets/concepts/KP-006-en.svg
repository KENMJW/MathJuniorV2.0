<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-006 · Real Numbers</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Square Roots &amp; Principal Roots</text>

  <!-- Core Content Graphic -->
  <g transform="translate(60, 75)">
    <rect class="layer-stage-1" x="30" y="20" width="110" height="110" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text class="layer-stage-2" x="85" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">Area = a (a≥0)</text>
    <line class="layer-stage-3 formal-labels" x1="30" y1="140" x2="140" y2="140" stroke="#2563eb" stroke-width="2"/>
    <text class="layer-stage-3 formal-labels" x="85" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">Side x = √a</text>
    <text class="layer-stage-4" x="190" y="70" font-size="11" font-weight="bold" fill="#dc2626">If x² = a</text>
    <text class="layer-stage-4" x="190" y="95" font-size="11" font-weight="bold" fill="#dc2626">Then x = ±√a</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Positive numbers have two</tspan>
    <tspan x="200" dy="14">square roots ±√a, √a is principal root</tspan>
  </text>
</svg>
