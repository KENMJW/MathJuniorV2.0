<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-007 · Real Numbers</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">Cube Roots</text>

  <!-- Core Content Graphic -->
  <g transform="translate(80, 70)">
    <rect class="layer-stage-1" x="30" y="50" width="70" height="70" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <polygon class="layer-stage-2" points="30,50 65,20 135,20 100,50" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <polygon class="layer-stage-2" points="100,50 135,20 135,90 100,120" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>
    <text class="layer-stage-3 formal-labels" x="65" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">Volume V</text>
    <text class="layer-stage-4" x="155" y="65" font-size="11" font-weight="bold" fill="#1d4ed8">Edge x = ∛V</text>
    <text class="layer-stage-4" x="155" y="90" font-size="10" fill="#475569">x³ = a (Unique Real)</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d1d1f">
    <tspan x="200" dy="0">Every real number has a</tspan>
    <tspan x="200" dy="14">unique cube root ∛a</tspan>
  </text>
</svg>
