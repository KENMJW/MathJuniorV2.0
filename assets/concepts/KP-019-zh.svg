<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-019 · 方程组</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">一元一次方程的解法与应用</text>


  <!-- Coordinate Lines Intersection / Parabola Vieta -->
  <g transform="translate(60, 80)">
    <!-- Axes -->
    <line class=\"layer-stage-1\" x1="20" y1="150" x2="260" y2="150" stroke="#86868b" stroke-width="1.5" />
    <line class=\"layer-stage-1\" x1="140" y1="20" x2="140" y2="170" stroke="#86868b" stroke-width="1.5" />
    <text class=\"layer-stage-3 formal-labels\" x="260" y="165" font-size="12" fill="#86868b">x</text>
    <text class=\"layer-stage-4\" x="130" y="25" font-size="12" fill="#86868b">y</text>
    <!-- Line 1: y = x + 1 -->
    <line class=\"layer-stage-1\" x1="40" y1="160" x2="220" y2="40" stroke="#0071e3" stroke-width="2.5"/>
    <!-- Line 2: y = -x + 3 -->
    <line class=\"layer-stage-2\" x1="40" y1="40" x2="220" y2="160" stroke="#ff9500" stroke-width="2.5"/>
    <!-- Intersection point (140, 100) -->
    <circle class=\"layer-stage-4\" cx="130" cy="100" r="5" fill="#ff3b30"/>
    <text class=\"layer-stage-4\" x="145" y="95" font-family="monospace" font-size="12" font-weight="bold" fill="#ff3b30">P(x₀, y₀)</text>
  </g>
  <text class=\"layer-stage-4\" x="200" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1f">消元与图象交点解</text>

</svg>