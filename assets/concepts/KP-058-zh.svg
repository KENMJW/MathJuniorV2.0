<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Card Header -->
  <rect x="20" y="16" width="360" height="42" rx="10" fill="#f2f2f7" />
  <text x="35" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0071e3">KP-058 · 相似三角形</text>
  <text x="365" y="42" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">相似三角形的判定</text>

  <!-- Core Content Graphic -->
  <g transform="translate(45, 68)">
    <!-- Small triangle -->
    <polygon class="layer-stage-1" points="50,60 20,135 90,135" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="layer-stage-1" x="50" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">△ABC</text>
    <!-- Similarity symbol -->
    <text class="layer-stage-2" x="125" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#047857">∽</text>
    <!-- Large scaled triangle -->
    <polygon class="layer-stage-3 formal-labels" points="205,25 150,145 270,145" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text class="layer-stage-3 formal-labels" x="205" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">△A'B'C'</text>
    <text class="layer-stage-4" x="140" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">判定: 两角分别相等 (AA 相似) 对应边成比例</text>
  </g>

  <!-- Footer Conclusion / Extrema / Vieta -->
  <text class="layer-stage-4" x="200" y="270" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1d1d1f">相似判定定理：两角分别相等的两三角形相似 (AA)</text>
</svg>
